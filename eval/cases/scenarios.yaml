# Case-evaluation scenarios: what the system is given, nothing more.
#
# Each scenario names a deterministic world (backend/src/onramp/evaluation/worlds.py), the
# subject the reporter names, and the reporter's words. The expected outcome lives in
# truth.yaml, which the evaluation harness reads and the application never does.
version: 2
scenarios:
  - id: payout_settlement_failed
    case_type: payout
    world_fixture: payout_settlement_failed
    subject_id: s_100
    report: I finished this task two weeks ago and the money never reached my bank.

  - id: payout_paid_in_full
    case_type: payout
    world_fixture: payout_paid_in_full
    subject_id: s_101
    report: I don't think I was paid for this one. Can you check?

  - id: payout_partial_settlement
    case_type: payout
    world_fixture: payout_partial_settlement
    subject_id: s_102
    report: The amount that arrived is less than the task listed.

  - id: payout_not_eligible
    case_type: payout
    world_fixture: payout_not_eligible
    subject_id: s_103
    report: Why was I never paid for this task?

  - id: payout_within_window
