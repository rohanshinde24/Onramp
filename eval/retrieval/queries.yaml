# Retrieval benchmark, version 1.
#
# Each query is phrased the way a worker message or an operator question would be, not copied
# from a section heading. `relevant` lists every passage that answers it under the policy
# version in force at `at`. Labels were written by the corpus author, so treat results as a
# check on retrieval behavior, not as an independent relevance study.
version: 1
queries:
