# Reference investigations reused from eval/cases for the fault scenarios that need the model.
version: 2
model: reference
investigations:
  provider_outage_then_recovers: &id001
  - &id002
    - tool: get_case
  - &id003
    - tool: get_submission
    - tool: get_quality_reviews
    - tool: get_payments
  - &id004
    - tool: get_payment_events
      args:
        payment_id: pay_107
  - &id005
    - tool: get_policy_passage
      args:
        passage_id: payout_v11_section_3_1
  - &id006
    - tool: submit_conclusion
      args:
        decision: escalate
        escalation_reason: policy_referral
        confidence: 0.8
        reason_codes:
        - PARTIAL_SETTLEMENT_NOT_COVERED
        citations:
        - payout_v11_section_3_1
        evidence_refs:
        - submission:s_107
        - task:t_107
        - payment:pay_107
        - payment_event:pay_107_auth
        - payment_event:pay_107_settled
        rationale: The task listed 6000 cents and 4500 settled. Payout policy v11 has no rule for
          a partial settlement, so the policy in force does not decide this; a lead should.
  crash_after_investigation_commit: *id001
  duplicate_evidence_upload:
  - - tool: get_case
  - - tool: get_worker
    - tool: get_verifications
    - tool: get_documents
  - - tool: get_policy_passage
      args:
        passage_id: onboarding_v4_section_2_1
    - tool: get_policy_passage
      args:
        passage_id: onboarding_v4_section_2_2
  - - tool: submit_conclusion
      args:
        decision: resolve
        resolution_code: REQUIREMENTS_MET
        confidence: 0.9
        reason_codes:
        - REQUIREMENTS_MET
        citations:
        - onboarding_v4_section_2_1
        - onboarding_v4_section_2_2
        evidence_refs:
        - worker:w_cho
        - verification:v_w_cho_identity
        - verification:v_w_cho_skills_assessment
        - verification:v_w_cho_tax_form
        proposed_action:
          action_type: ACTIVATE_WORKER
        rationale: Identity, skills assessment and the tax form section 2.2 requires for US workers
          have all passed, so section 2.1 activates the worker.
  search_outage_then_recovers:
  - *id002
  - - tool: search_policy
      args:
        query: payment settled for less than the task payout
  - *id003
  - *id004
  - *id005
  - *id006
