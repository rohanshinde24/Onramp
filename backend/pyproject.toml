[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "onramp"
version = "0.1.0"
description = "Operations platform for task marketplace onboarding, quality-review and payout cases"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143,<0.144",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "pyjwt>=2.15,<3",
    "confluent-kafka>=2.16,<3",
    "pyyaml>=6.0,<7",
    "elasticsearch>=9.1,<9.2",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-fastapi==0.66b1",
]

[project.scripts]
onramp-api = "onramp.entrypoints.api:main"
onramp-dev-token = "onramp.entrypoints.dev_token:main"
onramp-migrate = "onramp.entrypoints.migrate:main"
onramp-seed = "onramp.entrypoints.seed:main"
onramp-kafka-topics = "onramp.entrypoints.kafka_topics:main"
onramp-outbox-publisher = "onramp.entrypoints.outbox_publisher:main"
onramp-event-consumer = "onramp.entrypoints.event_consumer:main"
onramp-dlq-replay = "onramp.entrypoints.dlq_replay:main"
onramp-load-policies = "onramp.entrypoints.load_policies:main"
onramp-policy-indexer = "onramp.entrypoints.policy_indexer:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.13,<3",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "import-linter>=2.15,<3",
    "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/onramp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
markers = [
    "integration: needs PostgreSQL or another service from docker compose",
    "kafka: needs the compose Kafka broker",
    "search: needs the compose Elasticsearch node",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "PT", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/*/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "onramp"

[[tool.importlinter.contracts]]
name = "Marketplace tables are private to the marketplace package (ADR-002)"
type = "forbidden"
source_modules = [
    "onramp.api",
    "onramp.audit",
    "onramp.cases",
    "onramp.config",
    "onramp.db",
    "onramp.entrypoints",
    "onramp.identity",
    "onramp.models",
    "onramp.telemetry",
]
forbidden_modules = ["onramp.marketplace.models", "onramp.marketplace.builder"]
# The reader and writer import the tables; callers may use them, but not the tables directly.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Foundation modules do not depend on domain modules"
type = "forbidden"
source_modules = ["onramp.config", "onramp.db", "onramp.telemetry"]
forbidden_modules = ["onramp.identity", "onramp.audit", "onramp.marketplace"]
