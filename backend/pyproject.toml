[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "onramp"
version = "0.1.0"
description = "Operations platform for task marketplace onboarding, quality-review and payout cases"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143,<0.144",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-fastapi==0.66b1",
]

[project.scripts]
onramp-api = "onramp.entrypoints.api:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.13,<3",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "import-linter>=2.15,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/onramp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
markers = [
    "integration: needs PostgreSQL or another service from docker compose",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "PT", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
