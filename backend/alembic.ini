# Two migration chains, one per database (ADR-002). Run with -n onramp or -n marketplace.
# Database URLs come from the environment, never from this file.

[onramp]
script_location = %(here)s/migrations/onramp
file_template = %%(rev)s_%%(slug)s
path_separator = os

[marketplace]
script_location = %(here)s/migrations/marketplace
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
