# Local development dependencies. The default profile is PostgreSQL only; other services
# join through profiles as the phases that need them land.
name: onramp

services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: onramp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onramp-local}
      POSTGRES_DB: onramp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onramp -d onramp"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    profiles: ["events", "app"]
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for containers on the compose network, EXTERNAL for processes on the host.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      # 127.0.0.1 rather than localhost: localhost resolves to ::1 first, which the broker does
      # not listen on, and librdkafka's reconnect backoff can then exceed delivery timeouts.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker: replication factor 1 proves semantics, not durability.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created explicitly by onramp-kafka-topics, never by a typo in a producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  elasticsearch:
    profiles: ["search", "app", "agent"]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    environment:
      discovery.type: single-node
      # Local only: no auth or TLS, bound to 127.0.0.1 below.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 40

  migrate:
    profiles: ["app", "workflow", "agent"]
    build: ./backend
    command: ["onramp-migrate"]
    environment: &app-env
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://onramp:${POSTGRES_PASSWORD:-onramp-local}@postgres:5432/onramp
      MARKETPLACE_DATABASE_URL: postgresql+psycopg://onramp:${POSTGRES_PASSWORD:-onramp-local}@postgres:5432/marketplace
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    restart: unless-stopped
    build: ./backend
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 25s

  kafka-topics:
    profiles: ["app"]
    build: ./backend
    command: ["onramp-kafka-topics"]
    environment: *app-env
    depends_on:
      kafka:
        condition: service_healthy

  policy-indexer:
    profiles: ["app", "agent"]
    build: ./backend
    command: ["sh", "-c", "onramp-load-policies /home/onramp/policies && onramp-policy-indexer"]
    environment:
      <<: *app-env
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - ./policies:/home/onramp/policies:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy

  temporal:
    profiles: ["workflow", "app", "agent"]
    image: temporalio/temporal:1.9.1
    command:
      ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      # The image runs as the temporal user and owns only its home directory. Mounting there
      # lets Docker give a new volume that ownership; a fresh volume anywhere else is root's
      # and the server cannot create its database.
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 30

  workflow-worker:
    profiles: ["workflow", "app"]
    restart: unless-stopped
    build: ./backend
    command: ["onramp-workflow-worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    stop_grace_period: 30s

  agent-worker:
    profiles: ["agent"]
    restart: unless-stopped
    build: ./backend
    command: ["onramp-agent-worker"]
    environment:
      <<: *app-env
      ELASTICSEARCH_URL: http://elasticsearch:9200
      # Empty unless set. Compose reads this file for every profile, so a required variable here
      # would break `make up`; the agent worker itself refuses to start without a key.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      policy-indexer:
        condition: service_completed_successfully
    stop_grace_period: 30s

  outbox-publisher:
    profiles: ["app"]
    restart: unless-stopped
    build: ./backend
    command: ["onramp-outbox-publisher"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    stop_grace_period: 30s

  event-consumer:
    profiles: ["app"]
    restart: unless-stopped
    build: ./backend
    command: ["onramp-event-consumer"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    stop_grace_period: 30s

  case-signal-consumer:
    profiles: ["app"]
    restart: unless-stopped
    build: ./backend
    command: ["onramp-case-signal-consumer"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    stop_grace_period: 30s

  marketplace-relay:
    profiles: ["app"]
    restart: unless-stopped
    build: ./backend
    command: ["onramp-outbox-publisher", "marketplace"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    stop_grace_period: 30s

  # Browser end-to-end stack (`make e2e`): its own API, workflow worker and in-memory Temporal
  # over the onramp_e2e and marketplace_e2e databases, so a run never reads or writes the dev
  # databases or the dev Temporal server. `make e2e` recreates those databases first.
  e2e-setup:
    profiles: ["e2e"]
    build: ./backend
    command:
      ["sh", "-c", "onramp-migrate && onramp-load-policies /home/onramp/policies && onramp-seed"]
    environment: &e2e-env
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://onramp:${POSTGRES_PASSWORD:-onramp-local}@postgres:5432/onramp_e2e
      MARKETPLACE_DATABASE_URL: postgresql+psycopg://onramp:${POSTGRES_PASSWORD:-onramp-local}@postgres:5432/marketplace_e2e
      TEMPORAL_ADDRESS: temporal-e2e:7233
    volumes:
      - ./policies:/home/onramp/policies:ro
    depends_on:
      postgres:
        condition: service_healthy

  temporal-e2e:
    profiles: ["e2e"]
    image: temporalio/temporal:1.9.1
    # No database file: workflow history lives in memory and is gone with the container.
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--headless"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 30

  api-e2e:
    profiles: ["e2e"]
    build: ./backend
    environment: *e2e-env
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      e2e-setup:
        condition: service_completed_successfully
      temporal-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 2s
      timeout: 3s
      retries: 30

  workflow-worker-e2e:
    profiles: ["e2e"]
    build: ./backend
    command: ["onramp-workflow-worker"]
    environment: *e2e-env
    depends_on:
      e2e-setup:
        condition: service_completed_successfully
      temporal-e2e:
        condition: service_healthy

volumes:
  postgres-data:
  temporal-data:
