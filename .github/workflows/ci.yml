name: ci

on:
  pull_request:
  push:
    branches: [main, "build/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: onramp
          POSTGRES_PASSWORD: onramp-ci
          POSTGRES_DB: onramp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U onramp -d onramp"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://onramp:onramp-ci@localhost:5432/onramp
      MARKETPLACE_DATABASE_URL: postgresql+psycopg://onramp:onramp-ci@localhost:5432/marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Create marketplace database
        run: psql "postgresql://onramp:onramp-ci@localhost:5432/onramp" -f ../deploy/postgres/init-databases.sql
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not integration"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t onramp:ci backend
