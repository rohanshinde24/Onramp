# Bounded investigations on the isolated agent task queue. KEDA owns the replica count.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onramp-agent-worker
  labels:
    app.kubernetes.io/name: onramp-agent-worker
    app.kubernetes.io/component: agent-worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: onramp-agent-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onramp-agent-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-worker
          image: onramp-ml
          # Images are loaded into the node, never pulled.
          imagePullPolicy: IfNotPresent
          command: ["onramp-agent-worker"]
          envFrom:
            - configMapRef:
                name: onramp-config
            - secretRef:
                name: onramp-secrets
            - secretRef:
                name: onramp-model-credentials
          ports:
            - name: health
              containerPort: 8081
          startupProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: onramp-agent-worker
spec:
  scaleTargetRef:
    name: onramp-agent-worker
  # No investigations waiting, no agent workers and no model connections.
  minReplicaCount: 0
  maxReplicaCount: 3
  pollingInterval: 10
  cooldownPeriod: 300
  triggers:
    - type: temporal
      metadata:
        endpointFromEnv: TEMPORAL_ADDRESS
        namespace: default
        taskQueue: onramp-agent
        queueTypes: activity
        # Investigations waiting per replica before another starts.
        targetQueueSize: "2"
        activationTargetQueueSize: "0"
        enableTLS: "false"
