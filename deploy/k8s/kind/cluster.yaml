# Local cluster for the Onramp process roles (ADR-013). One node holds every pod.
# The API's NodePort is published on 127.0.0.1:8180 only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: onramp
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8180
        listenAddress: 127.0.0.1
        protocol: TCP
