# Temporal workflows and non-model activities. On SIGTERM the worker stops polling and gives
# running activities 20 s; an activity cut off after that is retried elsewhere, and every
# activity is safe to retry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onramp-workflow-worker
  labels:
    app.kubernetes.io/name: onramp-workflow-worker
    app.kubernetes.io/component: workflow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onramp-workflow-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onramp-workflow-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workflow-worker
          image: onramp-core
          command: ["onramp-workflow-worker"]
          envFrom:
            - configMapRef:
                name: onramp-config
            - secretRef:
                name: onramp-secrets
          ports:
            - name: health
              containerPort: 8081
          # Readiness turns on when the loop starts; the startup probe bounds how long that takes.
          startupProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 2
            failureThreshold: 90
          # Fails only when the loop stops beating, never on a dependency outage.
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
