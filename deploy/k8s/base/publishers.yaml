# Relays Onramp's outbox to Kafka. A cycle in progress finishes on SIGTERM. Two replicas
# overlapping in a rollout are safe: SKIP LOCKED splits rows and aggregate_version protects
# order (ADR-005).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onramp-outbox-publisher
  labels:
    app.kubernetes.io/name: onramp-outbox-publisher
    app.kubernetes.io/component: outbox-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onramp-outbox-publisher
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onramp-outbox-publisher
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outbox-publisher
          image: onramp-core
          # Images are loaded into the node, never pulled.
          imagePullPolicy: IfNotPresent
          command: ["onramp-outbox-publisher"]
          envFrom:
            - configMapRef:
                name: onramp-config
            - secretRef:
                name: onramp-secrets
          ports:
            - name: health
              containerPort: 8081
          # Readiness turns on when the loop starts; the startup probe bounds how long that takes.
          startupProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 2
            failureThreshold: 90
          # Fails only when the loop stops beating, never on a dependency outage.
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Stands in for the marketplace's own relay of its outbox.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onramp-marketplace-relay
  labels:
    app.kubernetes.io/name: onramp-marketplace-relay
    app.kubernetes.io/component: marketplace-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onramp-marketplace-relay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onramp-marketplace-relay
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: marketplace-relay
          image: onramp-core
          # Images are loaded into the node, never pulled.
          imagePullPolicy: IfNotPresent
          command: ["onramp-outbox-publisher", "marketplace"]
          envFrom:
            - configMapRef:
                name: onramp-config
            - secretRef:
                name: onramp-secrets
          ports:
            - name: health
              containerPort: 8081
          # Readiness turns on when the loop starts; the startup probe bounds how long that takes.
          startupProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 2
            failureThreshold: 90
          # Fails only when the loop stops beating, never on a dependency outage.
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
