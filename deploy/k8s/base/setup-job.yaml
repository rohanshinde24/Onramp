# Runs before every rollout (`make k8s-deploy` deletes and re-creates it): migrations, Kafka
# topics, then the policy corpus baked into the ml image is loaded and indexed. Every step is
# idempotent. Init containers run in order, so a failure names its step.
apiVersion: batch/v1
kind: Job
metadata:
  name: onramp-setup
  labels:
    app.kubernetes.io/name: onramp-setup
    app.kubernetes.io/component: setup
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onramp-setup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: &pod-security
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: onramp-core
          command: ["onramp-migrate"]
          envFrom: &env
            - configMapRef:
                name: onramp-config
            - secretRef:
                name: onramp-secrets
          resources: &small
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts: &tmp
            - name: tmp
              mountPath: /tmp
        - name: kafka-topics
          image: onramp-core
          command: ["onramp-kafka-topics"]
          envFrom: *env
          resources: *small
          securityContext: *container-security
          volumeMounts: *tmp
      containers:
        - name: policy-sync
          image: onramp-ml
          command:
            ["sh", "-c", "onramp-load-policies /home/onramp/policies && onramp-policy-indexer"]
          envFrom: *env
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext: *container-security
          volumeMounts: *tmp
      volumes:
        - name: tmp
          emptyDir: {}
