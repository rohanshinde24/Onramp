# Records marketplace evidence on cases (group onramp-case-evidence). KEDA scales it on lag
# when the autoscaling component is on; without it, one replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onramp-event-consumer
  labels:
    app.kubernetes.io/name: onramp-event-consumer
    app.kubernetes.io/component: event-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onramp-event-consumer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onramp-event-consumer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: event-consumer
          image: onramp-core
          # Images are loaded into the node, never pulled.
          imagePullPolicy: IfNotPresent
          command: ["onramp-event-consumer"]
          envFrom:
            - configMapRef:
                name: onramp-config
            - secretRef:
                name: onramp-secrets
          ports:
            - name: health
              containerPort: 8081
          # Readiness turns on when the loop starts; the startup probe bounds how long that takes.
          startupProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 2
            failureThreshold: 90
          # Fails only when the loop stops beating, never on a dependency outage.
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
